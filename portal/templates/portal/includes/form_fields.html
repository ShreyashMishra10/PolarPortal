<!-- Prints every field of a Django form with its label, help text and errors.
     Used by the contact, login, sign up and submit article pages. -->
{% if form.non_field_errors %}
    <div class="form-error">{{ form.non_field_errors }}</div>
{% endif %}

{% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
            <div class="helptext">{{ field.help_text }}</div>
        {% endif %}
        {{ field.errors }}
    </div>
{% endfor %}
