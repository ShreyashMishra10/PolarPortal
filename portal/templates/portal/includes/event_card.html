<!-- One event row. Used on the home page and the Events page. -->
<div class="event reveal {% if is_past %}past{% endif %}">
    <div class="event-date">
        <div class="day">{{ event.date|date:"d" }}</div>
        <div class="month">{{ event.date|date:"M Y" }}</div>
    </div>
    <div class="event-info">
        <h3>{{ event.title }}</h3>
        <div class="event-meta">
            {% if event.is_online %}🌐 Online{% else %}📍 {{ event.location }}{% endif %}
            &middot; {{ event.date|date:"g:i A" }}
        </div>
        <p>{{ event.description }}</p>
    </div>
</div>
